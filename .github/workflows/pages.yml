# Publie la version web autonome du jeu (packages/app/webview, `yarn build:web`) sur GitHub Pages
# à chaque push sur main. Un seul index.html (JS/CSS + niveaux maps/map*.json inlinés), intégrable
# en iframe : https://<utilisateur>.github.io/<dépôt>/
# Prérequis (une fois) : Settings → Pages → Source : « GitHub Actions ».
name: Deploy web to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      # --ignore-scripts : seul Vite est nécessaire au build web ; évite les postinstall de la
      # partie React Native / Expo du monorepo.
      - run: yarn install --frozen-lockfile --ignore-scripts

      - run: yarn build:web

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: packages/app/webview/dist-web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
