<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Tic-Tac-Tic — 04 Arcade</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;800;900&display=swap" rel="stylesheet" />
<style>
  /* Charte 04 — ARCADE POP : néo-brutalisme. Jaune franc, contours noirs épais, ombres dures, rebonds. */
  :root {
    --yellow: #ffd400;
    --black: #111;
    --pink: #ff4fa3;
    --blue: #2d6cff;
    --green: #1ec28b;
    --white: #fff;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--yellow)
      radial-gradient(circle, rgba(0,0,0,.12) 1.5px, transparent 1.6px) 0 0 / 22px 22px;
    color: var(--black);
    font-family: Rubik, system-ui, sans-serif;
    display: grid; place-items: center; overflow: hidden; padding: 24px;
  }
  main { display: flex; flex-direction: column; align-items: center; gap: 26px; text-align: center; }
  .badge {
    background: var(--white); border: 3px solid var(--black); box-shadow: 4px 4px 0 var(--black);
    padding: 6px 14px; font-weight: 800; font-size: 13px; letter-spacing: .15em; transform: rotate(-4deg);
  }
  .logo { display: flex; flex-direction: column; gap: 8px; align-items: center; }
  .word {
    display: inline-block; font-weight: 900; font-size: clamp(40px, 13vw, 76px); line-height: 1;
    padding: 4px 18px 8px; border: 4px solid var(--black); box-shadow: 7px 7px 0 var(--black);
    color: var(--white); animation: hop 1.2s cubic-bezier(.3,1.6,.5,1) infinite;
  }
  .w1 { background: var(--pink); transform: rotate(-5deg); }
  .w2 { background: var(--blue); transform: rotate(3deg); animation-delay: .4s; }
  .w3 { background: var(--green); transform: rotate(-2deg); animation-delay: .8s; }
  @keyframes hop { 0%, 30%, 100% { translate: 0 0 } 15% { translate: 0 -10px } }
  .balls { display: flex; gap: 14px; }
  .balls span {
    width: 22px; height: 22px; border-radius: 50%; border: 3px solid var(--black);
    animation: bounce .8s ease-in infinite alternate;
  }
  .balls span:nth-child(1) { background: var(--pink); }
  .balls span:nth-child(2) { background: var(--blue); animation-delay: .2s; }
  .balls span:nth-child(3) { background: var(--green); animation-delay: .4s; }
  .balls span:nth-child(4) { background: var(--white); animation-delay: .6s; }
  @keyframes bounce { from { transform: translateY(-14px) } to { transform: translateY(0) scale(1.1, .9) } }
  button {
    font: inherit; font-weight: 900; font-size: 26px; letter-spacing: .05em;
    color: var(--black); background: var(--white);
    border: 4px solid var(--black); border-radius: 16px; padding: 14px 52px;
    box-shadow: 8px 8px 0 var(--black); cursor: pointer;
  }
  button:active { transform: translate(6px, 6px); box-shadow: 2px 2px 0 var(--black); }
  .hint { margin: 0; font-weight: 500; font-size: 15px; max-width: 290px; }
</style>
</head>
<body>
  <main>
    <div class="badge">NIVEAU 1 · 3 ÉTOILES À GAGNER</div>
    <div class="logo" aria-label="Tic-Tac-Tic">
      <span class="word w1">TIC</span>
      <span class="word w2">TAC</span>
      <span class="word w3">TIC</span>
    </div>
    <div class="balls" aria-hidden="true"><span></span><span></span><span></span><span></span></div>
    <button type="button">JOUER ▶</button>
    <p class="hint">Clique les aiguillages, envoie chaque balle dans le bon trou. Vite !</p>
  </main>
</body>
</html>
