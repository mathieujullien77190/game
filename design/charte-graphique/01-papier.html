<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Tic-Tac-Tic — 01 Papier</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700;900&display=swap" rel="stylesheet" />
<style>
  /* Charte 01 — PAPIER : minimal, papier crème, encre, rouge/bleu francs. Proche de l'existant, en plus soigné. */
  :root {
    --paper: #f4f1ea;
    --ink: #1f2a30;
    --muted: #7b8a91;
    --rail: #d9d3c5;
    --red: #e5383b;
    --red-dark: #a4161a;
    --blue: #1d6fe0;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--paper);
    color: var(--ink);
    font-family: Inter, system-ui, sans-serif;
    display: grid;
    place-items: center;
    overflow: hidden;
    padding: 24px;
  }
  .rails { position: fixed; inset: 0; width: 100%; height: 100%; }
  .rails path { fill: none; stroke: var(--rail); stroke-width: 6; stroke-linecap: round; }
  main { position: relative; display: flex; flex-direction: column; align-items: center; gap: 26px; text-align: center; }
  .logo { font-weight: 900; font-size: clamp(40px, 13vw, 84px); letter-spacing: -0.04em; line-height: .9; }
  .logo span { display: inline-block; animation: tick 2s ease-in-out infinite; }
  .logo .r { color: var(--red); }
  .logo .b { color: var(--blue); animation-duration: 1s; animation-delay: -.5s; }
  .logo .r2 { animation-delay: -1s; }
  .logo i { font-style: normal; color: var(--rail); }
  @keyframes tick { 0%,100% { transform: translateY(-4px); opacity: 1 } 25%,75% { transform: none; opacity: .35 } }
  .tag { margin: 0; font-weight: 700; color: var(--muted); font-size: 18px; }
  button {
    font: inherit; font-weight: 900; font-size: 22px; letter-spacing: .06em;
    color: #fff; background: var(--red); border: 0; border-radius: 999px;
    padding: 16px 64px; box-shadow: 0 6px 0 var(--red-dark); cursor: pointer;
  }
  button:active { transform: translateY(4px); box-shadow: 0 2px 0 var(--red-dark); }
  .hint { margin: 0; font-size: 14px; color: var(--muted); max-width: 300px; font-weight: 500; }
</style>
</head>
<body>
  <svg class="rails" viewBox="0 0 400 800" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
    <path id="p1" d="M -20 120 C 120 120 160 260 300 260 S 420 380 420 380" />
    <path id="p2" d="M 60 -20 L 60 300 Q 60 380 140 420 L 420 560" />
    <path id="p3" d="M -20 680 C 100 600 260 760 420 660" />
    <circle r="9" fill="#e5383b"><animateMotion dur="5s" repeatCount="indefinite"><mpath href="#p1" /></animateMotion></circle>
    <circle r="9" fill="#1d6fe0"><animateMotion dur="6.5s" repeatCount="indefinite"><mpath href="#p2" /></animateMotion></circle>
    <circle r="9" fill="#1f2a30"><animateMotion dur="4s" repeatCount="indefinite"><mpath href="#p3" /></animateMotion></circle>
  </svg>
  <main>
    <div class="logo" aria-label="Tic-Tac-Tic"><span class="r">TIC</span><i>·</i><span class="b">TAC</span><i>·</i><span class="r r2">TIC</span></div>
    <p class="tag">Route les balles. Maîtrise le temps.</p>
    <button type="button">JOUER</button>
    <p class="hint">Touche les aiguillages pour guider chaque balle jusqu'à l'arrivée.</p>
  </main>
</body>
</html>
