<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>CAO 08 — Tutoriel</title>
<link rel="stylesheet" href="cao.css" />
<style>
  /* Tutoriel : l'élément ciblé est « sélectionné » (poignées), une info-bulle cotée l'explique. */
  .stage { padding: 0; }
  .wrap { position: relative; width: 100%; height: 100%; display: grid; place-items: center; }
  .dimmer { position: absolute; inset: 0; background: rgba(4,12,22,.55); pointer-events: none;
            -webkit-mask: radial-gradient(circle 44px at var(--fx) var(--fy), transparent 98%, #000 100%);
            mask: radial-gradient(circle 44px at var(--fx) var(--fy), transparent 98%, #000 100%); }
  .target { position: absolute; left: var(--fx); top: var(--fy); width: 60px; height: 60px; transform: translate(-50%, -50%); border: 1px dashed var(--sel); animation: pulse 1.4s ease-in-out infinite; }
  .target i { position: absolute; width: 8px; height: 8px; background: var(--bg); border: 1.5px solid var(--sel); }
  .target i:nth-child(1) { top: -5px; left: -5px; } .target i:nth-child(2) { top: -5px; right: -5px; }
  .target i:nth-child(3) { bottom: -5px; left: -5px; } .target i:nth-child(4) { bottom: -5px; right: -5px; }
  @keyframes pulse { 50% { transform: translate(-50%, -50%) scale(1.12); } }
  .tip { position: absolute; left: 16px; right: 16px; top: calc(var(--fy) + 64px); max-width: 340px; margin: 0 auto; }
  .tip::before { content: ""; position: absolute; left: calc(50% - 1px); top: -34px; width: 1px; height: 30px; background: var(--sel); }
  .tip .body { gap: 10px; }
  .tip p { margin: 0; font-size: 13px; line-height: 1.55; }
  .tip .kbd { color: var(--orange); }
  .steps { display: flex; gap: 6px; }
  .steps span { width: 18px; height: 3px; background: rgba(255,255,255,.2); }
  .steps span.on { background: var(--orange); }
  .tip .foot { justify-content: space-between; align-items: center; }
</style>
</head>
<body>
  <div class="bar"><span><b>niv-01.dwg</b> — tutoriel</span><a href="03-jeu.html">passer ▸▸</a></div>
  <div class="stage">
    <div class="wrap" id="wrap" style="--fx:50%;--fy:50%">
      <div data-level style="width:100%;height:100%;display:grid;place-items:center;padding:14px"></div>
      <div class="dimmer"></div>
      <div class="target"><i></i><i></i><i></i><i></i></div>
      <div class="dialog tip">
        <div class="head"><b>AIDE · SW_01 — aiguillage</b><span>2 / 4</span></div>
        <div class="body">
          <p>Un aiguillage envoie les balles sur <b>une seule branche</b> à la fois. <span class="kbd">Touche-le</span> pour basculer.</p>
          <p style="color:var(--muted);font-size:11px">Astuce : bascule-le juste après le passage d'une balle.</p>
        </div>
        <div class="foot"><span class="steps"><span class="on"></span><span class="on"></span><span></span><span></span></span><a class="btn" href="03-jeu.html">SUIVANT ▸</a></div>
      </div>
    </div>
  </div>
  <div class="status"><span class="on">MODE AIDE</span><span>étape 2 : aiguillages</span></div>
  <script src="cao.js"></script>
  <script>
    // Cale le focus sur l'aiguillage SW_01 du plan (coords SVG 180,290 → écran).
    const wrap = document.getElementById("wrap")
    const focus = () => {
      const svg = wrap.querySelector("svg")
      if (!svg) return
      const p = new DOMPoint(180, 290).matrixTransform(svg.getScreenCTM())
      const r = wrap.getBoundingClientRect()
      wrap.style.setProperty("--fx", p.x - r.left + "px")
      wrap.style.setProperty("--fy", p.y - r.top + "px")
    }
    focus()
    addEventListener("resize", focus)
  </script>
</body>
</html>
