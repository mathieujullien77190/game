<style>
  /* Sélection de niveau = boîte « Ouvrir un fichier » : chapitres en dossiers, niveaux en .dwg. */
  .path { padding: 10px 14px; font-size: 11px; color: var(--muted); border-bottom: 1px solid var(--faint); background: rgba(13,34,56,.7); }
  .path b { color: var(--line); font-weight: 400; }
  .folders { display: flex; gap: 6px; padding: 10px 14px; overflow-x: auto; border-bottom: 1px solid var(--faint); scrollbar-width: none; }
  .folders::-webkit-scrollbar { display: none; }
  .folders a { flex: none; font-size: 11px; padding: 6px 10px; border: 1px solid rgba(255,255,255,.14); border-radius: 3px; color: var(--muted); }
  .folders a.on { border-color: var(--orange); color: var(--orange); }
  .folders a.lock { opacity: .45; }
  .list { flex: 1; overflow-y: auto; padding: 14px; display: grid; grid-template-columns: 1fr 1fr; gap: 12px; align-content: start; }
  .file { border: 1px solid rgba(255,255,255,.14); background: rgba(13,34,56,.6); display: flex; flex-direction: column; }
  .file.cur { border-color: var(--sel); box-shadow: 0 0 0 1px var(--sel); }
  .file .thumb { aspect-ratio: 1; border-bottom: 1px solid var(--faint); display: grid; place-items: center; }
  .file .thumb svg { width: 78%; }
  .file .thumb path { fill: none; stroke: #eaf4ff; stroke-width: 3; }
  .file .meta { padding: 7px 8px; font-size: 10px; display: flex; justify-content: space-between; align-items: center; }
  .file .stars { color: var(--orange); letter-spacing: 1px; }
  .file .stars s { color: rgba(255,255,255,.2); text-decoration: none; }
  .file.locked { opacity: .4; }
  .file.locked .thumb { font-size: 22px; color: var(--muted); }
  .file.locked .thumb span { font-size: 9px; display: block; text-align: center; margin-top: 4px; }
</style>
</head>
