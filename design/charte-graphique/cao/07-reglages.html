<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>CAO 07 — Options</title>
<link rel="stylesheet" href="cao.css" />
<style>
  /* Options = panneau de préférences logiciel : sections, cases [■], curseurs gradués, segments. */
  .panel { flex: 1; overflow-y: auto; padding: 6px 14px 20px; }
  section { padding: 14px 0 6px; }
  section h2 { margin: 0 0 8px; font-size: 10px; letter-spacing: .2em; color: var(--sel); font-weight: 700; display: flex; align-items: center; gap: 8px; }
  section h2::after { content: ""; flex: 1; height: 1px; background: var(--faint); }
  .opt { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--faint); font-size: 12px; gap: 12px; }
  .opt > span:first-child { flex: 1; min-width: 0; }
  .opt small { display: block; color: var(--muted); font-size: 10px; margin-top: 2px; }
  /* case à cocher CAO */
  .chk { appearance: none; width: 18px; height: 18px; border: 1.5px solid rgba(255,255,255,.35); margin: 0; display: grid; place-items: center; cursor: pointer; flex: none; }
  .chk:checked { border-color: var(--orange); }
  .chk:checked::after { content: ""; width: 10px; height: 10px; background: var(--orange); }
  /* curseur gradué */
  .rng { display: flex; align-items: center; gap: 8px; width: 130px; flex: none; }
  .rng input { flex: 1; min-width: 0; margin: 0; appearance: none; height: 2px; background: repeating-linear-gradient(90deg, rgba(255,255,255,.35) 0 1px, transparent 1px 10%), rgba(255,255,255,.12); }
  .rng input::-webkit-slider-thumb { appearance: none; width: 10px; height: 16px; background: var(--orange); cursor: pointer; }
  .rng input::-moz-range-thumb { width: 10px; height: 16px; background: var(--orange); border: 0; border-radius: 0; }
  .rng output { width: 30px; text-align: right; font-size: 11px; color: var(--orange); }
  /* segments */
  .seg { display: flex; border: 1px solid rgba(255,255,255,.2); flex: none; }
  .seg label { font-size: 10px; padding: 6px 8px; cursor: pointer; color: var(--muted); }
  .seg input { display: none; }
  .seg input:checked + span { color: var(--bg); background: var(--orange); margin: -6px -8px; padding: 6px 8px; display: block; }
</style>
</head>
<body>
  <div class="bar"><span><b>Options</b> — préférences</span><a href="01-accueil.html">✕</a></div>
  <div class="panel">
    <section><h2>AUDIO</h2>
      <div class="opt"><span>Effets</span><span class="rng"><input type="range" value="80" oninput="this.nextElementSibling.value=this.value" /><output>80</output></span></div>
      <div class="opt"><span>Musique<small>tempo calé sur l'horloge du niveau</small></span><span class="rng"><input type="range" value="40" oninput="this.nextElementSibling.value=this.value" /><output>40</output></span></div>
      <div class="opt"><span>Tic-tac des aiguillages</span><input class="chk" type="checkbox" checked /></div>
    </section>
    <section><h2>AFFICHAGE</h2>
      <div class="opt"><span>Grille</span><input class="chk" type="checkbox" checked /></div>
      <div class="opt"><span>Réticule<small>suit le doigt</small></span><input class="chk" type="checkbox" checked /></div>
      <div class="opt"><span>Cotes & étiquettes</span><input class="chk" type="checkbox" /></div>
      <div class="opt"><span>Thème</span>
        <span class="seg"><label><input type="radio" name="th" checked /><span>NUIT</span></label><label><input type="radio" name="th" /><span>PLAN</span></label><label><input type="radio" name="th" /><span>CALQUE</span></label></span></div>
    </section>
    <section><h2>JEU</h2>
      <div class="opt"><span>Vibrations</span><input class="chk" type="checkbox" checked /></div>
      <div class="opt"><span>Aide aux aiguillages<small>montre la prochaine branche</small></span><input class="chk" type="checkbox" /></div>
      <div class="opt"><span>Langue</span>
        <span class="seg"><label><input type="radio" name="lg" checked /><span>FR</span></label><label><input type="radio" name="lg" /><span>EN</span></label></span></div>
    </section>
  </div>
  <div class="status"><span class="ok">● ENREGISTRÉ</span><span>prefs.cfg</span></div>
  <script src="cao.js"></script>
</body>
</html>
