<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Blueprint B — Tracé</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700;800&display=swap" rel="stylesheet" />
<style>
  /* Blueprint B — TRACÉ : le plan se dessine tout seul à l'ouverture (traceur), puis les balles circulent. */
  :root {
    --blue: #0d3b66; --blue-2: #0a2f52;
    --grid: rgba(255,255,255,.07); --grid-major: rgba(255,255,255,.15);
    --line: #eaf4ff; --muted: #9dbbd8; --orange: #ff9f1c;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background:
      linear-gradient(var(--grid-major) 1px, transparent 1px) 0 0 / 100px 100px,
      linear-gradient(90deg, var(--grid-major) 1px, transparent 1px) 0 0 / 100px 100px,
      linear-gradient(var(--grid) 1px, transparent 1px) 0 0 / 20px 20px,
      linear-gradient(90deg, var(--grid) 1px, transparent 1px) 0 0 / 20px 20px,
      radial-gradient(ellipse at center, var(--blue), var(--blue-2));
    color: var(--line); font-family: "JetBrains Mono", ui-monospace, monospace;
    display: grid; place-items: center; overflow: hidden; padding: 24px;
  }
  main { display: flex; flex-direction: column; align-items: center; gap: 20px; text-align: center; width: 100%; }
  svg { width: min(100%, 340px); overflow: visible; }
  /* chaque tracé a pathLength=1 → dasharray 1 / offset 1→0 = « dessiné » */
  .draw { fill: none; stroke: var(--line); stroke-width: 2; stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw 1.2s ease-out forwards; }
  .d2 { animation-delay: .4s; } .d3 { animation-delay: .8s; } .d4 { animation-delay: 1.2s; } .d5 { animation-delay: 1.6s; }
  @keyframes draw { to { stroke-dashoffset: 0 } }
  .node { opacity: 0; transform-box: fill-box; transform-origin: center; animation: pop .35s cubic-bezier(.3,1.8,.5,1) forwards; }
  @keyframes pop { from { opacity: 0; transform: scale(0) } to { opacity: 1; transform: scale(1) } }
  .logo { font: 800 40px "JetBrains Mono", monospace; fill: none; stroke: var(--line); stroke-width: 1.3; letter-spacing: 3px;
          stroke-dasharray: 600; stroke-dashoffset: 600; animation: ink 2.2s ease-in-out 1.4s forwards; }
  @keyframes ink { to { stroke-dashoffset: 0 } }
  .late { opacity: 0; animation: fade .6s ease 2.8s forwards; }
  .later { opacity: 0; animation: fade .6s ease 3.2s forwards; }
  @keyframes fade { from { opacity: 0; transform: translateY(6px) } to { opacity: 1; transform: none } }
  .lbl { font: 400 8px "JetBrains Mono", monospace; fill: var(--muted); }
  /* tête de traceur qui balaie pendant le dessin */
  .plotter { animation: sweep 2.8s ease-in-out forwards; }
  @keyframes sweep { 0% { transform: translate(0, 0); opacity: 1 } 90% { opacity: 1 } 100% { transform: translate(300px, 250px); opacity: 0 } }
  .tag { margin: 0; font-size: 13px; color: var(--muted); }
  button { position: relative; font: inherit; font-weight: 700; font-size: 17px; letter-spacing: .25em; color: var(--blue-2);
           background: var(--orange); border: 0; padding: 14px 40px; cursor: pointer; }
  button::before, button::after { content: ""; position: absolute; width: 12px; height: 12px; border: 2px solid var(--line); }
  button::before { top: -7px; left: -7px; border-right: 0; border-bottom: 0; }
  button::after { bottom: -7px; right: -7px; border-left: 0; border-top: 0; }
  .hint { margin: 0; font-size: 11px; color: var(--muted); }
</style>
</head>
<body>
  <main>
    <svg viewBox="0 0 340 300" aria-label="Tic-Tac-Tic">
      <!-- réseau de rails -->
      <path id="r1" class="draw" pathLength="1" d="M 30 20 L 30 90 Q 30 110 50 120 L 170 170" />
      <path id="r2" class="draw d2" pathLength="1" d="M 170 20 L 170 170" />
      <path id="r3" class="draw d3" pathLength="1" d="M 310 20 L 310 80 Q 310 100 290 110 L 170 170" />
      <path id="r4" class="draw d4" pathLength="1" d="M 170 170 L 170 200 Q 170 215 185 215 L 310 215" />
      <path class="draw d5" pathLength="1" d="M 0 232 L 340 232" style="stroke: #9dbbd8; stroke-width: 1; stroke-dasharray: .01 .01" />
      <circle class="node" style="animation-delay:.2s" cx="30" cy="20" r="8" fill="#0d3b66" stroke="#eaf4ff" stroke-width="2" />
      <circle class="node" style="animation-delay:.6s" cx="170" cy="20" r="8" fill="#0d3b66" stroke="#eaf4ff" stroke-width="2" />
      <circle class="node" style="animation-delay:1s" cx="310" cy="20" r="8" fill="#0d3b66" stroke="#eaf4ff" stroke-width="2" />
      <rect class="node" style="animation-delay:1.4s" x="163" y="163" width="14" height="14" fill="#0d3b66" stroke="#ff9f1c" stroke-width="2" />
      <circle class="node" style="animation-delay:1.8s" cx="310" cy="215" r="10" fill="none" stroke="#ff9f1c" stroke-width="2" />
      <text class="lbl late" x="40" y="16">A</text><text class="lbl late" x="180" y="16">B</text><text class="lbl late" x="296" y="16">C</text>
      <text class="lbl late" x="184" y="160">SW_01</text><text class="lbl late" x="268" y="248">ARRIVÉE</text>
      <!-- balles, démarrent quand le plan est dessiné -->
      <circle r="5" fill="#ff9f1c" opacity="0"><set attributeName="opacity" to="1" begin="2.4s" />
        <animateMotion dur="3.4s" begin="2.4s" repeatCount="indefinite" path="M 30 20 L 30 90 Q 30 110 50 120 L 170 170 L 170 200 Q 170 215 185 215 L 310 215" /></circle>
      <circle r="5" fill="#eaf4ff" opacity="0"><set attributeName="opacity" to="1" begin="3.4s" />
        <animateMotion dur="2.8s" begin="3.4s" repeatCount="indefinite" path="M 170 20 L 170 200 Q 170 215 185 215 L 310 215" /></circle>
      <!-- logo tracé au trait -->
      <text class="logo" x="170" y="290" text-anchor="middle">TIC·TAC·TIC</text>
      <!-- tête de traceur -->
      <g class="plotter"><circle cx="20" cy="20" r="3" fill="#ff9f1c" /><line x1="20" y1="8" x2="20" y2="32" stroke="#ff9f1c" /><line x1="8" y1="20" x2="32" y2="20" stroke="#ff9f1c" /></g>
    </svg>
    <p class="tag late">// schéma de routage temporel</p>
    <button class="later" type="button">LANCER</button>
    <p class="hint later">Trace la bonne route. Chaque seconde compte.</p>
  </main>
</body>
</html>
